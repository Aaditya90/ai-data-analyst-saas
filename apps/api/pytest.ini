[pytest]
# Phase 17 (Testing) — pytest is layered ON TOP of the standalone
# `python tests/test_<phase>.py` scripts every phase since Phase 3 has
# already been delivering. Those scripts keep working unchanged (run them
# directly, or `pytest` will also collect them since they're plain
# `test_*` functions in `test_*.py` files — pytest doesn't care that they
# were originally written to be run with a bare interpreter). What's new
# in Phase 17 is:
#   - tests/conftest.py: shared fixtures (SQLite-backed db session, a
#     FastAPI TestClient with auth/DB dependency overrides, model
#     factories, and fakes for every optional external dependency:
#     Claude, Stripe, SMTP)
#   - tests/integration/: cross-phase workflow tests that exercise real
#     route handlers end-to-end against those fixtures, instead of only
#     the pure-Python pieces each phase's standalone test file covers
#   - markers below, so `pytest -m unit` (fast, no DB) can be separated
#     from `pytest -m integration` (DB + TestClient) in CI or locally
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: fast, dependency-free tests (pure functions, fakes exercised in isolation)
    integration: exercises FastAPI routes + a real (SQLite) DB session via TestClient
    postgres: requires a real Postgres connection (DATABASE_URL) — verifies
        behavior (Row-Level Security in particular) that SQLite cannot
        emulate; skipped automatically when DATABASE_URL isn't reachable
    slow: takes more than ~1s (e.g. AutoML fitting several models)

addopts =
    -ra
    --strict-markers
    --tb=short

filterwarnings =
    # SQLAlchemy occasionally warns about the SQLite dialect not
    # supporting a feature (e.g. some server-side defaults) that Postgres
    # supports natively — expected and harmless for a test DB standing in
    # for Postgres, not something a test run should fail on.
    ignore::sqlalchemy.exc.SAWarning
